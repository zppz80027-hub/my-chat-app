<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>drive fetch test</title></head>
<body><pre id="out">testing...</pre>
<script>
(async () => {
  const out = document.getElementById('out');
  const log = (o) => { out.textContent = JSON.stringify(o, null, 2); };
  const ID = '1ZMaXp3OCapDyP3VpIuCe6gwMiMjxYr1g';
  const base = 'https://drive.usercontent.google.com/download?id=' + ID + '&export=download&confirm=t';
  const res = { steps: [] };
  try {
    const r = await fetch(base);
    const ct = (r.headers.get('content-type') || '').toLowerCase();
    res.steps.push({ step: 'fetch', status: r.status, contentType: ct.slice(0, 80), isHtml: ct.includes('text/html') });
    if (!ct.includes('text/html')) { res.result = 'BYTES_NOT_HTML'; log(res); return; }
    const html = await r.text();
    const fm = html.match(/<form[^>]*id="download-form"[^>]*action="([^"]+)"/i);
    const get = (n) => { const m = html.match(new RegExp('name="' + n + '" value="([^"]*)"', 'i')); return m ? m[1] : null; };
    const uuid = get('uuid'), at = get('at');
    res.steps.push({ step: 'parse', hasForm: !!fm, hasUuid: !!uuid, hasAt: !!at, htmlLen: html.length });
    if (!fm || !uuid || !at) { res.result = 'PARSE_FAIL'; log(res); return; }
    const params = new URLSearchParams({ id: ID, export: 'download', confirm: 't', uuid, at });
    const finalUrl = fm[1] + '?' + params.toString();
    const r2 = await fetch(finalUrl, { headers: { Range: 'bytes=0-200' } });
    const ct2 = (r2.headers.get('content-type') || '').toLowerCase();
    const buf = new Uint8Array(await r2.arrayBuffer());
    let head = ''; for (let i = 0; i < Math.min(20, buf.length); i++) head += String.fromCharCode(buf[i]);
    res.steps.push({ step: 'finalUrl', status: r2.status, contentType: ct2.slice(0, 80), firstBytes: head.replace(/[^ -~]/g, '.') });
    res.result = (r2.status === 206 && !ct2.includes('text/html')) ? 'SUCCESS' : 'FAIL';
  } catch (e) {
    res.steps.push({ step: 'error', message: String(e) });
    res.result = 'ERROR';
  }
  log(res);
})();
</script></body></html>
