# Render Blueprint for the Chat App (one-click deploy from the repo root).
# In the Render dashboard: New > Blueprint > connect this repo. Render reads
# this file and creates the web service automatically.
#
# Persistence: uploaded files (movies, images) go to Cloudflare R2 when the
# R2_* env vars are set, and the SQLite DB is continuously replicated to R2
# via Litestream (server/scripts/boot.sh). Redeploys no longer wipe chat,
# users, or files. Without R2 env vars the app falls back to the old
# ephemeral behavior (everything on the free tier's throwaway disk).
services:
  - type: web
    name: chatapp
    runtime: node
    plan: free
    buildCommand: NPM_CONFIG_PRODUCTION=false npm run install:all && npm run build && bash server/scripts/fetch-litestream.sh
    startCommand: bash server/scripts/boot.sh
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: ~20
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MAX_FILE_SIZE
        value: 20GB
      # Cloudflare R2 (free tier: 10GB, no egress fees). sync:false = value
      # Render dashboard me set karo, repo me commit mat karo.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: cloude-files
      - key: R2_PUBLIC_URL
        sync: false
