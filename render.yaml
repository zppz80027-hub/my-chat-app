# Render Blueprint for the Chat App (one-click deploy from the repo root).
services:
  - type: web
    name: chatapp
    runtime: node
    plan: free
    buildCommand: npm run install:all && npm run build && bash server/scripts/fetch-litestream.sh
    startCommand: bash server/scripts/boot.sh
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: ~20
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MAX_FILE_SIZE
        value: 20GB
      - key: R2_BUCKET
        value: cloude-files
